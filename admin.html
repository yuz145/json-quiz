<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クイズ管理画面</title>
<style>
  :root {
    --bg: #f5f5f2;
    --card: #ffffff;
    --border: #d0d7de;
    --accent: #2e7d32;
    --accent-dark: #1b5e20;
    --danger: #d32f2f;
    --text: #212529;
    --muted: #6c757d;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px 12px 60px;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 28px 0 12px; font-weight: 700; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  input[type="text"], input[type="password"], textarea {
    width: 100%;
    font-size: 16px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    margin-bottom: 12px;
  }
  textarea { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; height: 160px; resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font-size: 15px;
    font-weight: 600;
    padding: 12px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  button.primary:hover { background: var(--accent-dark); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  .quiz-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px; flex-wrap: wrap; }
  .quiz-item:last-child { border-bottom: none; }
  .quiz-item .title { font-size: 15px; font-weight: 600; }
  .quiz-item .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  #error, #login-error { color: var(--danger); font-size: 14px; margin-top: 8px; white-space: pre-wrap; font-weight: bold; }
  #status-msg { color: var(--accent-dark); font-size: 14px; margin-top: 8px; font-weight: bold; }
  #login-screen { max-width: 400px; margin: 40px auto 0; width: 100%; }
  a.back-link { font-size: 14px; color: var(--accent-dark); text-decoration: underline; }

  .log-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .log-table th, .log-table td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
  }
  .log-table th {
    background: #f8f9fa;
    color: var(--muted);
    font-weight: 600;
  }
  .badge-complete {
    background: #e8f5e9;
    color: var(--accent-dark);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 12px;
  }
  .badge-ongoing {
    background: #fff8e1;
    color: #b78103;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 12px;
  }

  .ip-group-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .ip-group-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .ip-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .ip-title code {
    background: #e8f5e9;
    padding: 3px 8px;
    border-radius: 6px;
    font-family: SFMono-Regular, Consolas, monospace;
    color: var(--accent-dark);
  }
  .ip-stats-grid {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 13px;
    margin-top: 6px;
  }
  .ip-stat-item {
    background: #f8f9fa;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #e9ecef;
  }
  .ip-stat-item strong { color: var(--accent-dark); }
  .view-mode-btn {
    padding: 8px 14px;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
  }
  .view-mode-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-dark);
    font-weight: bold;
  }

  .admin-section { margin: 0; }
  .admin-section > summary {
    cursor: pointer;
    font-size: 17px;
    font-weight: 700;
    margin: 28px 0 12px;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .admin-section > summary::-webkit-details-marker { display: none; }
  .admin-section > summary::before {
    content: '▶';
    font-size: 11px;
    color: var(--muted);
  }
  .admin-section[open] > summary::before { content: '▼'; }
  .admin-section > summary:first-child { margin-top: 0; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login-screen">
    <h1>クイズ管理画面</h1>
    <div class="card">
      <label for="password-input">管理者パスワード</label>
      <input type="password" id="password-input" placeholder="パスワード">
      <button class="primary" id="login-btn">ログイン</button>
      <div id="login-error"></div>
    </div>
    <p style="font-size:13px;"><a class="back-link" href="index.html">← クイズに戻る</a></p>
  </div>

  <div id="admin-screen" style="display:none;">
    <h1>クイズ管理画面</h1>
    <p style="font-size:13px;"><a class="back-link" href="index.html">← クイズに戻る</a></p>

    <details class="admin-section" open>
      <summary>登録済みクイズセット</summary>
      <div class="card" id="quiz-list-card">
        <div id="quiz-list"></div>
        <div id="quiz-list-empty" style="font-size:13px; color:var(--muted);">まだクイズセットがありません。</div>
      </div>
    </details>

    <details class="admin-section">
      <summary>お知らせ編集（トップページの🔔から見られる内容）</summary>
      <div class="card" id="announcement-card">
        <p style="font-size:13px; color:var(--muted); margin-top:0;">ここに書いた内容が、クイズトップページ右上の🔔ボタンから見られる「お知らせ」として全ユーザーに表示されます。</p>
        <label for="announcement-input">お知らせ本文</label>
        <textarea id="announcement-input" style="font-family:inherit; height:140px;" placeholder="例: 2026/07/29 復習モードを追加しました。"></textarea>
        <div class="row">
          <button class="primary" id="announcement-save-btn">保存する</button>
        </div>
        <div id="announcement-error" style="color:var(--danger); font-size:14px; margin-top:8px; white-space:pre-wrap; font-weight:bold;"></div>
        <div id="announcement-status" style="color:var(--accent-dark); font-size:14px; margin-top:8px; font-weight:bold;"></div>
      </div>
    </details>

    <details class="admin-section">
      <summary>参加者管理（ニックネーム設定）</summary>
      <div class="card" id="nickname-card">
        <p style="font-size:13px; color:var(--muted); margin-top:0;">接続IPごとにニックネームを設定できます。設定すると、下のログ一覧でIPアドレスと併せて表示されます。</p>
        <div id="nickname-list"></div>
        <div id="nickname-empty" style="font-size:13px; color:var(--muted); display:none;">まだ記録された接続IPがありません。</div>
      </div>
    </details>

    <details class="admin-section">
      <summary>ユーザー解答・アクセス状況（IP・進捗ログ）</summary>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
        <div class="row" style="margin-top:0;">
          <button id="view-mode-ip" class="view-mode-btn active">🌐 IPごとにグループ化 &amp; 統計</button>
          <button id="view-mode-all" class="view-mode-btn">📋 全時系列ログ</button>
        </div>
        <div class="row" style="margin-top:0; gap:8px;">
          <button id="refresh-logs-btn" style="padding:6px 12px; font-size:13px; min-height:36px;">最新状態に更新</button>
          <button id="clear-logs-btn" class="danger" style="padding:6px 12px; font-size:13px; min-height:36px;">🗑️ 全ログを削除</button>
        </div>
      </div>

      <div id="logs-container">
        <div class="card" style="text-align:center; color:var(--muted); padding:20px;">ログイン後に表示されます。</div>
      </div>
    </details>

    <details class="admin-section">
      <summary id="form-title">新しいクイズセットを追加</summary>
      <div class="card">
        <label for="title-input">タイトル</label>
        <input type="text" id="title-input" placeholder="例: 地理クイズ">
        <label for="category-input">カテゴリ（教科）</label>
        <input type="text" id="category-input" list="category-list" placeholder="例: 国語、数学、歴史（未入力の場合は「未分類」）">
        <datalist id="category-list"></datalist>
        <label for="questions-input">問題（JSON配列: question と answer を持つオブジェクト）</label>
        <textarea id="questions-input">[
  { "question": "日本の首都は？", "answer": "東京" },
  { "question": "富士山がある都道府県は？（2つのうち1つ）", "answer": "静岡県・山梨県" }
]</textarea>
        <div class="row">
          <button class="primary" id="save-btn">追加する</button>
          <button id="cancel-edit-btn" style="display:none;">編集をキャンセル</button>
        </div>
        <div id="error"></div>
        <div id="status-msg"></div>
      </div>
    </details>
  </div>

</div>

<script>
let adminPassword = '';
let editingId = null;

const loginScreen = document.getElementById('login-screen');
const adminScreen = document.getElementById('admin-screen');
const errorBox = document.getElementById('error');
const statusMsg = document.getElementById('status-msg');

function authHeaders() {
  return { 'content-type': 'application/json', 'X-Admin-Password': adminPassword };
}

document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('password-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); login(); }
});

async function login() {
  const pw = document.getElementById('password-input').value;
  const loginError = document.getElementById('login-error');
  const loginBtn = document.getElementById('login-btn');
  loginError.textContent = '';
  if (!pw) {
    loginError.textContent = 'パスワードを入力してください。';
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = '認証中...';

  try {
    const res = await fetch('/api/admin/auth', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'X-Admin-Password': pw }
    });

    if (res.status === 401 || !res.ok) {
      loginError.textContent = 'パスワードが違います。';
      loginBtn.disabled = false;
      loginBtn.textContent = 'ログイン';
      return;
    }

    adminPassword = pw;
    try {
      sessionStorage.setItem('quizAdminPassword', pw);
    } catch (e) {}

    loginScreen.style.display = 'none';
    adminScreen.style.display = 'block';
    await loadQuizList();
    await loadNicknames();
    await loadUserLogs();
    await loadAnnouncement();
  } catch (e) {
    loginError.textContent = '認証通信エラー: ' + e.message;
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'ログイン';
  }
}

async function loadAnnouncement() {
  const errorEl = document.getElementById('announcement-error');
  const statusEl = document.getElementById('announcement-status');
  errorEl.textContent = '';
  statusEl.textContent = '';
  try {
    const res = await fetch('/api/announcement');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    document.getElementById('announcement-input').value = data.content || '';
  } catch (e) {
    errorEl.textContent = 'お知らせの取得に失敗しました:\n' + e.message;
  }
}

document.getElementById('announcement-save-btn').addEventListener('click', async () => {
  const errorEl = document.getElementById('announcement-error');
  const statusEl = document.getElementById('announcement-status');
  errorEl.textContent = '';
  statusEl.textContent = '';
  const content = document.getElementById('announcement-input').value;
  const btn = document.getElementById('announcement-save-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/announcement', {
      method: 'PUT',
      headers: authHeaders(),
      body: JSON.stringify({ content }),
    });
    if (res.status === 401) {
      errorEl.textContent = 'パスワードが違うため保存できませんでした。';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    statusEl.textContent = '保存しました。';
  } catch (e) {
    errorEl.textContent = '保存に失敗しました:\n' + e.message;
  } finally {
    btn.disabled = false;
  }
});

let currentLogs = [];
let activeLogMode = 'ip'; // 'ip' | 'all'
let ipNicknames = {}; // ip -> nickname（未設定は含まれない）

async function loadNicknames() {
  try {
    const res = await fetch('/api/nicknames', { headers: authHeaders() });
    if (!res.ok) return;
    const list = await res.json();
    ipNicknames = {};
    (Array.isArray(list) ? list : []).forEach(row => {
      if (row.nickname) ipNicknames[row.ip] = row.nickname;
    });
    renderNicknameList(list);
  } catch (e) {
    // ニックネーム一覧が取れなくても致命的ではない
  }
}

function renderNicknameList(list) {
  const container = document.getElementById('nickname-list');
  const emptyEl = document.getElementById('nickname-empty');
  container.innerHTML = '';
  if (!Array.isArray(list) || list.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  list.forEach(row => {
    const wrapper = document.createElement('div');
    wrapper.style.borderBottom = '1px solid var(--border)';

    const item = document.createElement('div');
    item.className = 'quiz-item';
    item.style.borderBottom = 'none';

    const ipDiv = document.createElement('div');
    ipDiv.innerHTML = '<code>' + escapeHtml(row.ip) + '</code>';

    const controls = document.createElement('div');
    controls.className = 'row';
    controls.style.marginTop = '0';

    const input = document.createElement('input');
    input.type = 'text';
    input.value = row.nickname || '';
    input.placeholder = 'ニックネーム未設定';
    input.style.cssText = 'width:180px; margin-bottom:0;';

    const saveBtn = document.createElement('button');
    saveBtn.textContent = '保存';
    saveBtn.style.cssText = 'padding:8px 14px; font-size:13px; min-height:36px;';
    saveBtn.addEventListener('click', () => saveNickname(row.ip, input.value, saveBtn));

    const detailBtn = document.createElement('button');
    detailBtn.textContent = '詳細を見る';
    detailBtn.style.cssText = 'padding:8px 14px; font-size:13px; min-height:36px;';

    controls.appendChild(input);
    controls.appendChild(saveBtn);
    controls.appendChild(detailBtn);
    item.appendChild(ipDiv);
    item.appendChild(controls);

    const detailPanel = document.createElement('div');
    detailPanel.style.cssText = 'display:none; padding:0 0 14px; font-size:13px;';
    detailPanel.innerHTML =
      '<div style="background:#f8f9fa; border-radius:8px; padding:10px 12px; margin-top:4px;">' +
        '<div style="margin-bottom:8px;"><strong>位置情報（接続時点・Cloudflare判定）</strong><br>' +
        '国: ' + escapeHtml(row.country || '不明') + ' ／ 地域: ' + escapeHtml(row.region || '不明') + ' ／ 都市: ' + escapeHtml(row.city || '不明') +
        '</div>' +
        '<div>' +
          '<button class="rdns-btn" style="padding:6px 12px; font-size:12px; min-height:32px;">🔍 逆引き(rDNS)を実行</button>' +
          '<span class="rdns-result" style="margin-left:8px; color:var(--muted);"></span>' +
        '</div>' +
      '</div>';

    detailBtn.addEventListener('click', () => {
      const isHidden = detailPanel.style.display === 'none';
      detailPanel.style.display = isHidden ? 'block' : 'none';
      detailBtn.textContent = isHidden ? '詳細を閉じる' : '詳細を見る';
    });

    const rdnsBtn = detailPanel.querySelector('.rdns-btn');
    const rdnsResult = detailPanel.querySelector('.rdns-result');
    rdnsBtn.addEventListener('click', () => lookupRdns(row.ip, rdnsBtn, rdnsResult));

    wrapper.appendChild(item);
    wrapper.appendChild(detailPanel);
    container.appendChild(wrapper);
  });
}

async function lookupRdns(ip, btn, resultEl) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '問い合わせ中...';
  resultEl.textContent = '';
  try {
    const res = await fetch('/api/admin/rdns?ip=' + encodeURIComponent(ip), { headers: authHeaders() });
    if (res.status === 401) {
      resultEl.textContent = 'パスワードが違うため取得できませんでした。';
      return;
    }
    const data = await res.json();
    if (data.hostname) {
      resultEl.textContent = data.hostname;
      resultEl.style.color = 'var(--accent-dark)';
    } else {
      resultEl.textContent = data.error || '取得できませんでした。';
      resultEl.style.color = 'var(--muted)';
    }
  } catch (e) {
    resultEl.textContent = '通信エラー: ' + e.message;
    resultEl.style.color = 'var(--danger)';
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function saveNickname(ip, nickname, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '保存中...';
  try {
    const res = await fetch('/api/nicknames', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ ip, nickname: nickname.trim() }),
    });
    if (res.status === 401) {
      alert('パスワードが違うため保存できませんでした。');
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const trimmed = nickname.trim();
    if (trimmed) {
      ipNicknames[ip] = trimmed;
    } else {
      delete ipNicknames[ip];
    }
    renderLogs();
    btn.textContent = '保存済み ✓';
    setTimeout(() => { btn.textContent = original; }, 1500);
  } catch (e) {
    alert('ニックネームの保存に失敗しました:\n' + e.message);
    btn.textContent = original;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('refresh-logs-btn').addEventListener('click', loadUserLogs);
document.getElementById('clear-logs-btn').addEventListener('click', clearAllLogs);

async function clearAllLogs() {
  if (!confirm('現在までのユーザー取り組みログ・アクセスIP記録をすべて全削除します。\n本当に削除してよろしいですか？（元に戻せません）')) {
    return;
  }
  const clearBtn = document.getElementById('clear-logs-btn');
  clearBtn.disabled = true;
  clearBtn.textContent = '削除中...';
  try {
    const res = await fetch('/api/admin/progress', {
      method: 'DELETE',
      headers: authHeaders()
    });
    if (res.status === 401) {
      alert('パスワードが違うため削除できませんでした。');
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    currentLogs = [];
    renderLogs();
    alert('現在までの取り組みログをすべて全削除しました。');
  } catch (e) {
    alert('ログの全削除に失敗しました:\n' + e.message);
  } finally {
    clearBtn.disabled = false;
    clearBtn.textContent = '🗑️ 全ログを削除';
  }
}

document.getElementById('view-mode-ip').addEventListener('click', () => {
  activeLogMode = 'ip';
  document.getElementById('view-mode-ip').classList.add('active');
  document.getElementById('view-mode-all').classList.remove('active');
  renderLogs();
});

document.getElementById('view-mode-all').addEventListener('click', () => {
  activeLogMode = 'all';
  document.getElementById('view-mode-all').classList.add('active');
  document.getElementById('view-mode-ip').classList.remove('active');
  renderLogs();
});

async function loadUserLogs() {
  const container = document.getElementById('logs-container');
  if (!container) return;
  container.innerHTML = '<div class="card" style="text-align:center; color:var(--muted); padding:20px;">読み込み中...</div>';
  try {
    const res = await fetch('/api/admin/progress', {
      headers: authHeaders()
    });
    if (res.status === 401) {
      container.innerHTML = '<div class="card" style="text-align:center; color:var(--danger); padding:20px;">パスワードが不一致のためログを取得できません。</div>';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    currentLogs = await res.json();
    renderLogs();
  } catch (e) {
    container.innerHTML = '<div class="card" style="text-align:center; color:var(--danger); padding:20px;">取得エラー: ' + escapeHtml(e.message) + '</div>';
  }
}

function renderLogs() {
  const container = document.getElementById('logs-container');
  if (!container) return;
  if (!Array.isArray(currentLogs) || currentLogs.length === 0) {
    container.innerHTML = '<div class="card" style="text-align:center; color:var(--muted); padding:20px;">取り組みログがまだありません。</div>';
    return;
  }

  container.innerHTML = '';

  if (activeLogMode === 'ip') {
    renderIpGroupedLogs(container);
  } else {
    renderAllLogsTable(container);
  }
}

function renderIpGroupedLogs(container) {
  const groups = new Map();
  currentLogs.forEach(log => {
    const ip = log.ip || 'ローカル / 不明';
    if (!groups.has(ip)) groups.set(ip, []);
    groups.get(ip).push(log);
  });

  groups.forEach((ipLogs, ip) => {
    const totalAttempts = ipLogs.length;
    const completedCount = ipLogs.filter(l => l.completed).length;
    const ongoingCount = totalAttempts - completedCount;
    
    let sumCorrect = 0;
    let sumTotal = 0;
    ipLogs.forEach(l => {
      if (l.completed) {
        sumCorrect += (l.correct || 0);
        sumTotal += (l.totalCount || 0);
      } else {
        sumCorrect += (l.correct || 0);
        sumTotal += ((l.correct || 0) + (l.wrong || 0));
      }
    });
    const overallRate = sumTotal > 0 ? Math.round((sumCorrect / sumTotal) * 100) : 0;
    const devices = [...new Set(ipLogs.map(l => l.deviceId))];
    const latestDate = ipLogs[0] && ipLogs[0].updatedAt ? new Date(ipLogs[0].updatedAt).toLocaleString('ja-JP') : '-';

    const nickname = ipNicknames[ip];
    const nicknameHtml = nickname
      ? ' <span style="color:var(--accent-dark); font-weight:700;">（' + escapeHtml(nickname) + '）</span>'
      : '';

    const card = document.createElement('div');
    card.className = 'ip-group-card';
    card.innerHTML =
      '<div class="ip-group-header">' +
        '<div>' +
          '<div class="ip-title">🌐 接続IP: <code>' + escapeHtml(ip) + '</code>' + nicknameHtml + '</div>' +
          '<div style="font-size:12px; color:var(--muted); margin-top:4px;">端末ID: ' + escapeHtml(devices.map(d => d.slice(0, 12) + '...').join(', ')) + '</div>' +
        '</div>' +
        '<div style="font-size:12px; color:var(--muted); text-align:right;">最終アクセス: ' + escapeHtml(latestDate) + '</div>' +
      '</div>' +
      '<div class="ip-stats-grid">' +
        '<div class="ip-stat-item">挑戦回数: <strong>' + totalAttempts + '回</strong> (完走 ' + completedCount + ' / 解答中 ' + ongoingCount + ')</div>' +
        '<div class="ip-stat-item">枠内通算正答率: <strong>' + overallRate + '%</strong> (' + sumCorrect + ' / ' + sumTotal + '問)</div>' +
      '</div>' +
      '<div style="overflow-x:auto; margin-top:12px;">' +
        '<table class="log-table">' +
          '<thead>' +
            '<tr>' +
              '<th>日時</th>' +
              '<th>クイズ名</th>' +
              '<th>スコア・解答進捗</th>' +
              '<th>ステータス</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody class="ip-table-body"></tbody>' +
        '</table>' +
      '</div>';

    const tbody = card.querySelector('.ip-table-body');
    ipLogs.forEach(log => {
      const tr = document.createElement('tr');
      const dateStr = log.updatedAt ? new Date(log.updatedAt).toLocaleString('ja-JP') : '-';
      const statusBadge = log.completed
        ? '<span class="badge-complete">完走</span>'
        : '<span class="badge-ongoing">解答中 (' + (log.idx + 1) + '/' + log.totalCount + '問)</span>';

      const bestStr = ' ／ ベスト ' + (log.bestCorrect || 0) + '/' + log.totalCount + '問';
      const scoreStr = (log.completed
        ? log.correct + ' / ' + log.totalCount + ' 正解 (' + Math.round((log.correct / (log.totalCount || 1)) * 100) + '%)'
        : (log.correct + '正解 / ' + log.wrong + '不正解')) + bestStr;

      tr.innerHTML =
        '<td>' + escapeHtml(dateStr) + '</td>' +
        '<td><strong>' + escapeHtml(log.quizTitle) + '</strong> <span style="font-size:11px; color:var(--muted);">[' + escapeHtml(log.category) + ']</span></td>' +
        '<td>' + escapeHtml(scoreStr) + '</td>' +
        '<td>' + statusBadge + '</td>';
      tbody.appendChild(tr);
    });

    container.appendChild(card);
  });
}

async function loadQuizList() {
  const listEl = document.getElementById('quiz-list');
  const emptyEl = document.getElementById('quiz-list-empty');
  listEl.innerHTML = '';
  try {
    const res = await fetch('/api/quizzes');
    const list = await res.json();
    updateCategoryOptions(list);
    if (!Array.isArray(list) || list.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    const groups = new Map();
    list.forEach(entry => {
      const category = entry.category || '未分類';
      if (!groups.has(category)) groups.set(category, []);
      groups.get(category).push(entry);
    });

    groups.forEach((entries, category) => {
      const heading = document.createElement('div');
      heading.style.cssText = 'font-size:12px; font-weight:bold; color:var(--accent-dark); margin:14px 0 4px;';
      heading.textContent = category;
      listEl.appendChild(heading);

      entries.forEach(entry => {
        const row = document.createElement('div');
        row.className = 'quiz-item';
        row.innerHTML =
          '<div><div class="title">' + escapeHtml(entry.title) + '</div>' +
          '<div class="meta">ID: ' + escapeHtml(entry.id) + ' ／ ' + entry.count + '問 ／ 更新: ' + escapeHtml(entry.updatedAt || '') + '</div></div>';
        const btnWrap = document.createElement('div');
        btnWrap.className = 'row';
        const editBtn = document.createElement('button');
        editBtn.textContent = '編集';
        editBtn.addEventListener('click', () => loadForEdit(entry.id));
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'danger';
        deleteBtn.textContent = '削除';
        deleteBtn.addEventListener('click', () => deleteQuiz(entry.id, entry.title));
        btnWrap.appendChild(editBtn);
        btnWrap.appendChild(deleteBtn);
        row.appendChild(btnWrap);
        listEl.appendChild(row);
      });
    });
  } catch (e) {
    errorBox.textContent = '一覧の取得に失敗しました:\n' + e.message;
  }
}

function updateCategoryOptions(list) {
  const datalist = document.getElementById('category-list');
  datalist.innerHTML = '';
  const categories = new Set(['未分類']);
  if (Array.isArray(list)) {
    list.forEach(entry => categories.add(entry.category || '未分類'));
  }
  categories.forEach(category => {
    const opt = document.createElement('option');
    opt.value = category;
    datalist.appendChild(opt);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadForEdit(id) {
  errorBox.textContent = '';
  statusMsg.textContent = '';
  try {
    const res = await fetch('/api/quiz/' + encodeURIComponent(id));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    editingId = id;
    document.getElementById('title-input').value = data.title;
    document.getElementById('category-input').value = data.category || '未分類';
    document.getElementById('questions-input').value = JSON.stringify(data.questions, null, 2);
    document.getElementById('form-title').textContent = '「' + data.title + '」を編集';
    document.getElementById('save-btn').textContent = '更新する';
    document.getElementById('cancel-edit-btn').style.display = 'inline-block';
    window.scrollTo({ top: document.getElementById('form-title').offsetTop - 20, behavior: 'smooth' });
  } catch (e) {
    errorBox.textContent = '読み込みに失敗しました:\n' + e.message;
  }
}

document.getElementById('cancel-edit-btn').addEventListener('click', resetForm);

function resetForm() {
  editingId = null;
  document.getElementById('title-input').value = '';
  document.getElementById('category-input').value = '';
  document.getElementById('questions-input').value = '[\n  { "question": "", "answer": "" }\n]';
  document.getElementById('form-title').textContent = '新しいクイズセットを追加';
  document.getElementById('save-btn').textContent = '追加する';
  document.getElementById('cancel-edit-btn').style.display = 'none';
  errorBox.textContent = '';
  statusMsg.textContent = '';
}

async function deleteQuiz(id, title) {
  if (!confirm('「' + title + '」を削除します。よろしいですか？（元に戻せません）')) return;
  try {
    const res = await fetch('/api/quiz/' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: authHeaders(),
    });
    if (res.status === 401) {
      alert('パスワードが違うため削除できませんでした。');
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (editingId === id) resetForm();
    await loadQuizList();
  } catch (e) {
    errorBox.textContent = '削除に失敗しました:\n' + e.message;
  }
}

document.getElementById('save-btn').addEventListener('click', async () => {
  errorBox.textContent = '';
  statusMsg.textContent = '';
  const title = document.getElementById('title-input').value.trim();
  const category = document.getElementById('category-input').value.trim() || '未分類';
  const rawQuestions = document.getElementById('questions-input').value;

  if (!title) {
    errorBox.textContent = 'タイトルを入力してください。';
    return;
  }
  let questions;
  try {
    questions = JSON.parse(rawQuestions);
  } catch (e) {
    errorBox.textContent = 'JSONの形式が正しくありません:\n' + e.message;
    return;
  }
  if (!Array.isArray(questions) || questions.length === 0) {
    errorBox.textContent = '問題は question と answer を持つオブジェクトの配列にしてください。';
    return;
  }
  for (const q of questions) {
    if (typeof q.question !== 'string' || typeof q.answer !== 'string') {
      errorBox.textContent = '各要素に question と answer（文字列）が必要です。';
      return;
    }
  }

  try {
    const url = editingId ? '/api/quiz/' + encodeURIComponent(editingId) : '/api/quiz';
    const method = editingId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      headers: authHeaders(),
      body: JSON.stringify({ title, category, questions }),
    });
    if (res.status === 401) {
      errorBox.textContent = 'パスワードが違います。ログインし直してください。';
      return;
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || ('HTTP ' + res.status));
    }
    const message = editingId ? '更新しました。' : '追加しました。';
    resetForm();
    statusMsg.textContent = message;
    await loadQuizList();
  } catch (e) {
    errorBox.textContent = '保存に失敗しました:\n' + e.message;
  }
});

// リロード時のパスワード自動認証チェック
(async () => {
  try {
    const saved = sessionStorage.getItem('quizAdminPassword');
    if (saved) {
      document.getElementById('password-input').value = saved;
      const res = await fetch('/api/admin/auth', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'X-Admin-Password': saved }
      });
      if (res.ok) {
        adminPassword = saved;
        loginScreen.style.display = 'none';
        adminScreen.style.display = 'block';
        await loadQuizList();
        await loadNicknames();
        await loadUserLogs();
        await loadAnnouncement();
      } else {
        sessionStorage.removeItem('quizAdminPassword');
      }
    }
  } catch (e) {
    // no-op
  }
})();
