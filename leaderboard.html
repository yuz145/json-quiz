<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ランキング</title>
<style>
  :root {
    --bg: #f5f5f2;
    --card: #ffffff;
    --border: #ddd;
    --accent: #4a7c59;
    --accent-dark: #33573d;
    --danger: #b5433e;
    --text: #222;
    --muted: #777;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px 16px 60px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  select {
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
  }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: normal; font-size: 12px; }
  td.rank { font-weight: bold; color: var(--accent-dark); width: 2.5em; }
  td.rate { font-weight: bold; }
  .status-completed { color: var(--accent-dark); }
  .status-progress { color: var(--muted); }
  #empty-msg, #error { font-size: 13px; color: var(--muted); margin-top: 10px; }
  #error { color: var(--danger); }
  a.back-link { font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ランキング</h1>
  <p style="font-size:13px;"><a class="back-link" href="index.html">← クイズアプリに戻る</a></p>

  <div class="card">
    <label for="quiz-select" style="font-size:13px; color:var(--muted); display:block; margin-bottom:6px;">クイズセットを選択</label>
    <select id="quiz-select"></select>

    <table id="board-table" style="display:none;">
      <thead>
        <tr>
          <th class="rank">順位</th>
          <th>名前</th>
          <th>正解</th>
          <th>不正解</th>
          <th>正答率</th>
          <th>状態</th>
          <th>最終更新</th>
        </tr>
      </thead>
      <tbody id="board-body"></tbody>
    </table>
    <div id="empty-msg" style="display:none;">まだ回答者がいません。</div>
    <div id="error"></div>
  </div>
</div>

<script>
async function loadQuizOptions() {
  const select = document.getElementById('quiz-select');
  try {
    const res = await fetch('/api/quizzes');
    const list = await res.json();
    select.innerHTML = '';
    if (!Array.isArray(list) || list.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = 'クイズセットがありません';
      select.appendChild(opt);
      return;
    }
    list.forEach(entry => {
      const opt = document.createElement('option');
      opt.value = entry.id;
      opt.textContent = entry.title || entry.id;
      select.appendChild(opt);
    });

    const params = new URLSearchParams(location.search);
    const preselect = params.get('quizId');
    if (preselect && list.some(e => e.id === preselect)) {
      select.value = preselect;
    }
    await loadLeaderboard(select.value);
  } catch (e) {
    document.getElementById('error').textContent = '一覧の取得に失敗しました:\n' + e.message;
  }
}

async function loadLeaderboard(quizId) {
  const table = document.getElementById('board-table');
  const body = document.getElementById('board-body');
  const emptyMsg = document.getElementById('empty-msg');
  const errorBox = document.getElementById('error');
  errorBox.textContent = '';
  body.innerHTML = '';
  if (!quizId) {
    table.style.display = 'none';
    emptyMsg.style.display = 'block';
    return;
  }
  try {
    const res = await fetch('/api/leaderboard/' + encodeURIComponent(quizId));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const results = await res.json();
    if (!Array.isArray(results) || results.length === 0) {
      table.style.display = 'none';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    table.style.display = 'table';
    results.forEach((r, i) => {
      const tr = document.createElement('tr');
      const updated = r.updatedAt ? new Date(r.updatedAt).toLocaleString('ja-JP') : '';
      tr.innerHTML =
        '<td class="rank">' + (i + 1) + '</td>' +
        '<td>' + escapeHtml(r.name) + '</td>' +
        '<td>' + r.correct + '</td>' +
        '<td>' + r.wrong + '</td>' +
        '<td class="rate">' + r.rate + '%</td>' +
        '<td class="' + (r.completed ? 'status-completed' : 'status-progress') + '">' + (r.completed ? '完了' : '進行中') + '</td>' +
        '<td>' + escapeHtml(updated) + '</td>';
      body.appendChild(tr);
    });
  } catch (e) {
    errorBox.textContent = 'ランキングの取得に失敗しました:\n' + e.message;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

document.getElementById('quiz-select').addEventListener('change', (e) => {
  loadLeaderboard(e.target.value);
});

loadQuizOptions();
</script>
</body>
</html>
