<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>クイズ</title>
<style>
  :root {
    --bg: #f5f5f2;
    --card: #ffffff;
    --border: #d0d7de;
    --accent: #2e7d32;
    --accent-dark: #1b5e20;
    --accent-light: #e8f5e9;
    --danger: #d32f2f;
    --text: #212529;
    --muted: #6c757d;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px 12px 60px;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 22px; margin: 0 0 16px; text-align: center; font-weight: 700; }
  textarea {
    width: 100%;
    height: 140px;
    font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 16px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    resize: vertical;
    background: #fafafa;
  }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .row button { flex: 1 1 calc(50% - 4px); }
  .row button.full-width { flex: 1 1 100%; }

  button {
    font-size: 15px;
    font-weight: 600;
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    touch-action: manipulation;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
  }
  button:active { transform: scale(0.98); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  button.primary:hover, button.primary:focus-visible { background: var(--accent-dark); }
  button:disabled { opacity: 0.4; cursor: default; transform: none; }
  #error { color: var(--danger); font-size: 14px; margin-top: 10px; white-space: pre-wrap; font-weight: bold; }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 20px 14px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    background: var(--card);
    margin-bottom: 14px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone.dragover { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }
  .dropzone p { margin: 0 0 10px; }
  .dropzone .filename { font-size: 13px; color: var(--accent-dark); margin-top: 8px; font-weight: bold; }
  .stats-summary-card {
    background: #e8f5e9;
    border: 1px solid #c8e6c9;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .stats-title { font-size: 13px; font-weight: bold; color: var(--accent-dark); margin-bottom: 4px; }
  .stats-counter { font-size: 16px; font-weight: bold; color: var(--accent-dark); margin-bottom: 8px; }
  .badge-score {
    display: block;
    font-size: 11px;
    font-weight: bold;
    color: var(--accent-dark);
    margin-top: 4px;
    background: rgba(46, 125, 50, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
  }

  #quiz-sets-section { display: none; margin-bottom: 16px; }
  .quiz-category-heading { font-size: 13px; font-weight: bold; color: var(--accent-dark); margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .quiz-category-heading:first-child { margin-top: 0; }
  .quiz-category-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .quiz-category-row button {
    flex: 1 1 calc(50% - 4px);
    min-width: 130px;
    padding: 12px 8px;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #global-settings-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .settings-row { display: flex; gap: 8px; flex-wrap: nowrap; }
  .toggle-btn {
    flex: 1 1 0;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 8px;
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    min-height: 52px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .toggle-btn.on {
    background: var(--accent);
    border-color: var(--accent-dark);
    color: #ffffff;
    box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);
  }
  .toggle-btn.off {
    background: #e9ecef;
    border-color: #ced4da;
    color: #495057;
  }
  #quiz-screen { display: none; }
  .progress-bar-outer {
    width: 100%;
    height: 10px;
    background: #e0e0e0;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar-inner {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
    font-weight: 500;
  }
  .score { font-weight: bold; color: var(--text); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 14px;
    min-height: 110px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .question-area {
    position: sticky;
    top: 0;
    background: var(--card);
    padding-top: env(safe-area-inset-top, 0px);
    z-index: 5;
  }
  .q-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .q-text { font-size: 18px; line-height: 1.5; font-weight: 600; word-break: break-word; }
  .a-block { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .a-text { font-size: 17px; color: var(--accent-dark); font-weight: bold; word-break: break-word; }
  #user-answer-line { font-size: 13px; color: var(--muted); margin-top: 6px; word-break: break-word; }
  #auto-hint-badge {
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    padding: 10px 14px;
    border-radius: 10px;
    margin-top: 10px;
    border: 2px solid transparent;
  }
  #auto-hint-badge.match { background: #e8f5e9; color: var(--accent-dark); border-color: var(--accent); }
  #auto-hint-badge.mismatch { background: #ffebee; color: var(--danger); border-color: var(--danger); }
  .review-item { border-radius: 10px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); }
  .review-item.correct { background: #e8f5e9; border-color: var(--accent); }
  .review-item.wrong { background: #ffebee; border-color: var(--danger); }
  .review-item .review-q { font-size: 14px; font-weight: 700; margin-bottom: 6px; word-break: break-word; }
  .review-item .review-a-row { font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .review-item .review-label { font-weight: bold; white-space: nowrap; }
  .review-item.correct .review-label { color: var(--accent-dark); }
  .review-item.wrong .review-label { color: var(--danger); }
  .review-item .review-answer { word-break: break-word; }
  .review-item .review-user-answer { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-word; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-box {
    background: var(--card);
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    border-radius: 16px 16px 0 0;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    position: sticky;
    top: 0;
    background: var(--card);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 16px; font-weight: 700; }
  .qlist-item { border-bottom: 1px solid var(--border); padding: 12px 0; cursor: pointer; }
  .qlist-item:last-child { border-bottom: none; }
  .qlist-item.qlist-current { background: var(--accent-light); border-radius: 8px; padding: 12px; margin: 0 -12px; border-bottom-color: transparent; }
  .qlist-current-badge { display: inline-block; margin-left: 6px; padding: 1px 7px; font-size: 11px; font-weight: 700; border-radius: 4px; background: var(--accent); color: #fff; vertical-align: middle; }
  .qlist-q { font-size: 14px; font-weight: 600; word-break: break-word; }
  .qlist-a { font-size: 13px; color: var(--accent-dark); font-weight: bold; margin-top: 8px; display: none; word-break: break-word; }
  .qlist-a.revealed { display: block; }
  .qlist-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .judge-row { display: flex; gap: 8px; margin-top: 12px; }
  .judge-row button { flex: 1 1 calc(50% - 4px); min-height: 48px; font-size: 16px; font-weight: bold; }
  .btn-correct { background: #e8f5e9; border-color: var(--accent); color: var(--accent-dark); }
  .btn-correct:hover { background: var(--accent); color: #fff; }
  .btn-wrong { background: #ffebee; border-color: var(--danger); color: var(--danger); }
  .btn-wrong:hover { background: var(--danger); color: #fff; }
  .key-hint {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.92);
    color: #333;
    border: 1px solid rgba(0, 0, 0, 0.3);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    vertical-align: middle;
  }
  .btn-subtle {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 8px 10px;
    min-height: 40px;
    text-decoration: underline;
    cursor: pointer;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    touch-action: manipulation;
  }
  .btn-subtle:hover { color: var(--text); background: rgba(0,0,0,0.04); }
  .nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; gap: 8px; }
  .nav-row #next-btn { flex: 1; min-height: 48px; font-size: 16px; }
  #type-answer-input {
    flex: 1 1 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    min-height: 44px;
    background: var(--card);
  }
  #type-answer-row { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  #type-answer-row button { width: 100%; min-height: 44px; }
  #result-screen { display: none; text-align: center; padding: 24px 0; }
  #result-screen .big { font-size: 44px; font-weight: bold; margin: 12px 0; color: var(--accent-dark); }
  .result-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; justify-content: center; }
  .result-actions button.full-width { flex: 1 1 100%; min-height: 48px; font-size: 16px; }

  @media (max-width: 480px) {
    body { padding: 10px 8px 30px; }
    h1 { font-size: 20px; margin-bottom: 12px; }
    .toggle-btn { font-size: 14px; padding: 12px 4px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="setup-screen">
    <h1>クイズ</h1>

    <div id="resume-banner" style="display:none; background:#fff8e1; border:1px solid #e0c46c; border-radius:8px; padding:14px; margin-bottom:16px; font-size:14px;">
      <div id="resume-text">前回の続きがあります。</div>
      <div class="row">
        <button class="primary" id="resume-btn">続きから再開する</button>
        <button id="discard-btn">最初からやり直す</button>
      </div>
    </div>

    <div id="global-settings-row">
      <div class="settings-row">
        <button id="shuffle-toggle" class="toggle-btn on">シャッフル: ON</button>
        <button id="answer-mode-toggle" class="toggle-btn on">回答形式: 文字入力</button>
      </div>
    </div>

    <div id="quiz-sets-section" style="display:none; margin-bottom:16px;">
      <div id="overall-stats-card" class="stats-summary-card" style="display:none;">
        <div class="stats-title">全体の達成度</div>
        <div class="stats-counter" id="overall-stats-counter">0 / 0問 (0%)</div>
        <div class="progress-bar-outer"><div class="progress-bar-inner" id="overall-progress-bar" style="width:0%;"></div></div>
      </div>
      <div class="q-label">クイズセットを選ぶ</div>
      <div id="quiz-sets-list"></div>
    </div>

    <div id="error"></div>
  </div>

  <div id="quiz-screen">
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar"></div></div>
    <div class="meta">
      <span id="q-counter">1 / 10問</span>
      <span class="score">正解 <span id="correct-count">0</span> / 不正解 <span id="wrong-count">0</span></span>
    </div>
    <div class="row" style="justify-content:flex-end; margin:0 0 10px;">
      <button id="question-list-btn" class="btn-subtle" style="font-size:12px; padding:6px 10px; min-height:32px;">📋 問題一覧を見る</button>
    </div>
    <div class="card">
      <div class="question-area" id="question-area">
        <div class="q-label">問題</div>
        <div class="q-text" id="q-text"></div>
      </div>
      <div class="a-block" id="a-block" style="display:none;">
        <div class="q-label">答え</div>
        <div class="a-text" id="a-text"></div>
        <div id="user-answer-line" style="display:none;"></div>
      </div>
    </div>
    <div class="row" style="margin-top:10px;" id="reveal-row">
      <button class="primary full-width" id="reveal-btn">答えを表示<span class="key-hint">Enter</span></button>
    </div>
    <div style="margin-top:10px; display:none;" id="type-answer-row">
      <input type="text" id="type-answer-input" placeholder="答えを入力してEnterまたは「回答する」">
      <button class="primary full-width" id="submit-answer-btn">回答する</button>
    </div>
    <div id="auto-hint-badge" style="display:none;"></div>
    <button id="override-correct-btn" class="btn-subtle" style="display:none; font-size:13px; padding:6px 10px; min-height:32px; margin-top:8px;">正解として記録する</button>
    <div class="judge-row" id="judge-row" style="display:none;">
      <button class="btn-wrong" id="mark-wrong">不正解だった<span class="key-hint" id="mark-wrong-key-hint">Space / F</span></button>
      <button class="btn-correct" id="mark-correct">正解した<span class="key-hint" id="mark-correct-key-hint">Enter / J</span></button>
    </div>
    <div class="nav-row">
      <button id="back-to-setup" class="btn-subtle">← 最初に戻る</button>
      <button id="next-btn" class="primary" disabled>次の問題 →<span class="key-hint" id="next-btn-key-hint" style="display:none;">Enter</span></button>
    </div>
  </div>

  <div id="result-screen">
    <div class="q-label">結果</div>
    <div class="big" id="final-score">0 / 0</div>
    <p id="final-msg" style="color:var(--muted);"></p>
    <div class="result-actions">
      <button class="primary full-width" id="review-btn" style="display:none;">間違えた問題を復習する（<span id="review-count">0</span>問）</button>
      <button class="primary full-width" id="restart-btn">もう一度挑戦</button>
      <div style="width:100%; text-align:left; margin-top:12px;">
        <button id="edit-again-btn" class="btn-subtle">← 最初に戻る</button>
      </div>
    </div>
    <div id="answer-review-section" style="display:none; text-align:left; margin-top:20px;">
      <div class="q-label" style="text-align:left;">解答一覧</div>
      <div id="answer-review-list"></div>
    </div>
  </div>

</div>

<div id="question-list-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">📋 問題一覧（<span id="question-list-count">0</span>問）</div>
      <button id="question-list-close" class="btn-subtle">✕ 閉じる</button>
    </div>
    <p style="font-size:12px; color:var(--muted); margin:0 0 10px;">タップすると答えの表示・非表示を切り替えられます。</p>
    <div id="question-list-body"></div>
  </div>
</div>

<script>
const APP_VERSION = '2026-07-25-14';
(function enforceLatestVersion() {
  const VERSION_KEY = 'quizAppVersion';
  let storedVersion;
  try {
    storedVersion = localStorage.getItem(VERSION_KEY);
  } catch (e) {
    return; // localStorageが使えない環境ではバージョンチェック自体を諦める
  }
  if (storedVersion === null) {
    // 初回訪問者はそのまま通し、現在のバージョンだけ記録する（リロードしない）
    try { localStorage.setItem(VERSION_KEY, APP_VERSION); } catch (e) {}
    return;
  }
  if (storedVersion !== APP_VERSION) {
    // 既存ユーザーが古いキャッシュを持っている場合のみ、1回だけ強制リロードする。
    // 先にバージョンを更新してから reload するため、次回以降は一致して無限リロードにならない。
    try { localStorage.setItem(VERSION_KEY, APP_VERSION); } catch (e) {}
    location.reload();
    throw new Error('quizApp: reloading to pick up APP_VERSION ' + APP_VERSION); // 以降の初期化処理を止める
  }
})();

let quiz = [];
let order = [];
let idx = 0;
let correct = 0;
let wrong = 0;
let shuffleOn = true;
let wrongIndices = [];
let answerHistory = []; // 今回の周回で解答した順の記録: {question, correctAnswer, userAnswer, isCorrect}
let lastTypedAnswer = null; // 直近に「回答する」した入力文字列（自己採点モードではnullのまま）
let awaitingJudgeConfirmation = false; // 「正解した/不正解だった」の確定待ちかどうか。
                                        // 入力欄のフォーカス状態やdisplayの一時的なタイミングに依存させないための専用フラグ
let mode = 'normal'; // 'normal' | 'review'
let answerMode = 'type'; // 'self' | 'type'
let currentQuizId = null;   // KV上のクイズID（貼り付け/ファイル読み込みの場合はnull）

const setupScreen = document.getElementById('setup-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const errorBox = document.getElementById('error');

function setToggleButton(el, isOn, label) {
  el.textContent = label;
  el.classList.toggle('on', isOn);
  el.classList.toggle('off', !isOn);
}

function updateShuffleToggle() {
  setToggleButton(document.getElementById('shuffle-toggle'), shuffleOn, 'シャッフル: ' + (shuffleOn ? 'ON' : 'OFF'));
}

function updateAnswerModeToggle() {
  setToggleButton(
    document.getElementById('answer-mode-toggle'),
    answerMode === 'type',
    '回答形式: ' + (answerMode === 'self' ? '答えを見る' : '文字入力')
  );
}

const SETTINGS_KEY = 'quizAppSettings_v1';

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.shuffleOn === 'boolean') shuffleOn = data.shuffleOn;
    if (data.answerMode === 'self' || data.answerMode === 'type') answerMode = data.answerMode;
  } catch (e) {
    // 壊れた設定値は無視してデフォルトのまま使う
  }
}

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({ shuffleOn, answerMode }));
  } catch (e) {
    // 保存できなくても致命的ではない（次回はデフォルト設定になるだけ）
  }
}

loadSettings();
updateShuffleToggle();
updateAnswerModeToggle();

const STORAGE_KEY = 'quizAppProgress_v1';
const DEVICE_ID_KEY = 'quizAppDeviceId';

function getOrCreateDeviceId() {
  let id = null;
  try {
    id = localStorage.getItem(DEVICE_ID_KEY);
  } catch (e) {
    // localStorageが使えない場合はセッション限りのIDになる
  }
  if (!id) {
    id = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    try {
      localStorage.setItem(DEVICE_ID_KEY, id);
    } catch (e) {
      // 保存できなくても続行する（次回アクセス時は新しいIDになる）
    }
  }
  return id;
}

const deviceId = getOrCreateDeviceId();

function saveProgress() {
  // サーバーへの同期とは切り離し、ローカルの「続きから再開する」用にはこれまで通り毎回保存する
  const data = {
    quiz, order, idx, correct, wrong, shuffleOn, wrongIndices, mode, answerMode,
    currentQuizId,
    savedAt: Date.now()
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    // localStorageが使えない環境（容量超過等）では黙って諦める
  }
}

// サーバー同期はKV/D1書き込みを減らすため「3問ごと＋離脱時＋クイズ終了時」のハイブリッドにする
let pendingSyncCount = 0;

function buildProgressPayload(completed) {
  return {
    quizId: currentQuizId, idx, order, correct, wrong, wrongIndices,
    mode, answerMode, shuffleOn, completed: !!completed
  };
}

async function saveServerProgress(completed) {
  if (!currentQuizId) return;
  pendingSyncCount = 0;
  try {
    await fetch('/api/progress/' + encodeURIComponent(deviceId), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(buildProgressPayload(completed))
    });
  } catch (e) {
    // オフライン等で保存に失敗しても、ローカルの進行は止めない
  }
}

// 1問解答するたびに呼ぶ。3問溜まった時だけサーバーへ送信し、それ未満はメモリ内に留める
function maybeSyncAfterAnswer() {
  if (!currentQuizId) return;
  pendingSyncCount++;
  if (pendingSyncCount >= 3) {
    saveServerProgress(false);
  }
}

// ページを離れる（タブを閉じる/切り替える等）瞬間に、3問未満で溜まっている進捗を
// navigator.sendBeacon() で確実に送信する。fetchと違い、ページ遷移中でも送信が完了しやすい。
function sendProgressBeacon() {
  if (!currentQuizId || pendingSyncCount === 0) return;
  try {
    const payload = JSON.stringify(buildProgressPayload(false));
    const blob = new Blob([payload], { type: 'application/json' });
    const sent = navigator.sendBeacon('/api/progress/' + encodeURIComponent(deviceId), blob);
    if (sent) pendingSyncCount = 0;
  } catch (e) {
    // sendBeaconが使えない環境では諦める（次に開いた時にまた3問ごとの同期でカバーされる）
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') sendProgressBeacon();
});
window.addEventListener('pagehide', sendProgressBeacon);

function clearProgress() {
  localStorage.removeItem(STORAGE_KEY);
}

function loadProgress() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try {
    const data = JSON.parse(raw);
    if (!Array.isArray(data.quiz) || !Array.isArray(data.order)) return null;
    return data;
  } catch (e) {
    return null;
  }
}

function checkResume() {
  const data = loadProgress();
  if (!data) return;
  const banner = document.getElementById('resume-banner');
  const text = document.getElementById('resume-text');
  const modeLabel = data.mode === 'review' ? '（復習モード）' : '';
  text.textContent = '前回の続き' + modeLabel + 'があります（' + (data.idx + 1) + ' / ' + data.order.length + '問、正解 ' + data.correct + ' / 不正解 ' + data.wrong + '）。続きから再開しますか？';
  banner.style.display = 'block';

  document.getElementById('resume-btn').addEventListener('click', () => {
    quiz = data.quiz;
    order = data.order;
    idx = data.idx;
    correct = data.correct;
    wrong = data.wrong;
    shuffleOn = data.shuffleOn;
    wrongIndices = data.wrongIndices || [];
    mode = data.mode || 'normal';
    answerMode = data.answerMode || 'self';
    currentQuizId = data.currentQuizId || null;
    pendingSyncCount = 0;
    updateShuffleToggle();
    updateAnswerModeToggle();
    banner.style.display = 'none';
    setupScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    renderQuestion();
  }, { once: true });

  document.getElementById('discard-btn').addEventListener('click', () => {
    clearProgress();
    banner.style.display = 'none';
  }, { once: true });
}

checkResume();

async function loadQuizSetList() {
  try {
    const res = await fetch('/api/quizzes?deviceId=' + encodeURIComponent(deviceId));
    if (!res.ok) return;
    const list = await res.json();
    if (!Array.isArray(list) || list.length === 0) return;
    const container = document.getElementById('quiz-sets-list');
    container.innerHTML = '';

    let totalQuestionsSum = 0;
    let totalBestCorrectSum = 0;
    let attemptedCount = 0;

    const groups = new Map();
    list.forEach(entry => {
      if (!entry || typeof entry.id !== 'string') return;
      const category = entry.category || '未分類';
      if (!groups.has(category)) groups.set(category, []);
      groups.get(category).push(entry);
    });

    groups.forEach((entries, category) => {
      const heading = document.createElement('div');
      heading.className = 'quiz-category-heading';
      heading.textContent = category;
      container.appendChild(heading);

      const row = document.createElement('div');
      row.className = 'quiz-category-row';
      entries.forEach(entry => {
        const btn = document.createElement('button');
        const count = entry.count || 0;

        let badgeText = '';
        if (entry.attempted && count) {
          const best = entry.bestCorrect || 0;
          const rate = Math.round((best / count) * 100);
          if (best === count) {
            badgeText = '🎉 満点 (100%)';
          } else {
            badgeText = '達成度 ' + best + '/' + count + '問 (' + rate + '%)';
          }
          totalQuestionsSum += count;
          totalBestCorrectSum += best;
          attemptedCount++;
        } else {
          totalQuestionsSum += count;
        }

        const titleSpan = document.createElement('span');
        titleSpan.textContent = (entry.title || entry.id) + '（' + count + '問）';
        btn.appendChild(titleSpan);

        if (badgeText) {
          const badge = document.createElement('span');
          badge.className = 'badge-score';
          badge.textContent = badgeText;
          btn.appendChild(badge);
        }

        btn.addEventListener('click', () => openQuizSet(entry.id, entry.title || entry.id));
        row.appendChild(btn);
      });
      container.appendChild(row);
    });

    if (groups.size > 0) {
      document.getElementById('quiz-sets-section').style.display = 'block';
      const statsCard = document.getElementById('overall-stats-card');
      if (attemptedCount > 0 && totalQuestionsSum > 0) {
        const overallRate = Math.round((totalBestCorrectSum / totalQuestionsSum) * 100);
        document.getElementById('overall-stats-counter').textContent =
          '正解 ' + totalBestCorrectSum + ' / 全 ' + totalQuestionsSum + '問 (' + overallRate + '%)';
        document.getElementById('overall-progress-bar').style.width = overallRate + '%';
        statsCard.style.display = 'block';
      } else {
        statsCard.style.display = 'none';
      }
    }
  } catch (e) {
    // /api/quizzes が使えない場合は手動入力のみ表示
  }
}

async function openQuizSet(id, title) {
  errorBox.textContent = '';
  try {
    const res = await fetch('/api/quiz/' + encodeURIComponent(id));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    currentQuizId = data.id;

    // 「続きから再開する」ボタン以外で開いた場合は、途中進捗をクリアして「最初から」始める
    clearProgress();
    startQuizFromArray(data.questions);
  } catch (e) {
    errorBox.textContent = 'クイズセットの読み込みに失敗しました:\n' + e.message;
  }
}

loadQuizSetList();

document.getElementById('shuffle-toggle').addEventListener('click', () => {
  shuffleOn = !shuffleOn;
  updateShuffleToggle();
  saveSettings();
});

document.getElementById('answer-mode-toggle').addEventListener('click', () => {
  answerMode = answerMode === 'self' ? 'type' : 'self';
  updateAnswerModeToggle();
  saveSettings();
});

function startQuizFromArray(data) {
  quiz = data;
  order = quiz.map((_, i) => i);
  if (shuffleOn) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }
  idx = 0;
  correct = 0;
  wrong = 0;
  wrongIndices = [];
  answerHistory = [];
  mode = 'normal';
  pendingSyncCount = 0;
  setupScreen.style.display = 'none';
  resultScreen.style.display = 'none';
  quizScreen.style.display = 'block';
  renderQuestion();
  saveProgress();
  return true;
}

function renderQuestion() {
  awaitingJudgeConfirmation = false;
  const item = quiz[order[idx]];
  document.getElementById('q-text').textContent = item.question;
  document.getElementById('a-text').textContent = item.answer;
  document.getElementById('a-block').style.display = 'none';
  document.getElementById('judge-row').style.display = 'none';
  document.getElementById('override-correct-btn').style.display = 'none';
  document.getElementById('user-answer-line').style.display = 'none';
  const badge = document.getElementById('auto-hint-badge');
  badge.style.display = 'none';
  badge.classList.remove('match', 'mismatch');
  document.getElementById('type-answer-input').value = '';
  lastTypedAnswer = null;
  document.getElementById('next-btn').disabled = true;
  document.getElementById('next-btn-key-hint').style.display = 'none';
  if (answerMode === 'type') {
    document.getElementById('reveal-row').style.display = 'none';
    document.getElementById('type-answer-row').style.display = 'flex';
    document.getElementById('type-answer-input').focus();
    document.getElementById('next-btn').style.display = '';
  } else {
    document.getElementById('reveal-row').style.display = 'flex';
    document.getElementById('type-answer-row').style.display = 'none';
    document.getElementById('reveal-btn').style.display = 'block';
    // 自己採点モードは正解した/不正解だったを押した時点で自動的に次へ進むため、
    // 「次の問題」ボタン自体は表示しない（内部的にはclick()で流用する）
    document.getElementById('next-btn').style.display = 'none';
  }
  document.getElementById('q-counter').textContent = (idx + 1) + ' / ' + order.length + '問' + (mode === 'review' ? '（復習）' : '');
  document.getElementById('progress-bar').style.width = Math.round(((idx) / order.length) * 100) + '%';
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('wrong-count').textContent = wrong;
}

document.getElementById('reveal-btn').addEventListener('click', () => {
  document.getElementById('a-block').style.display = 'block';
  document.getElementById('judge-row').style.display = 'flex';
  document.getElementById('reveal-btn').style.display = 'none';
  awaitingJudgeConfirmation = true;
});

function submitTypedAnswer() {
  const item = quiz[order[idx]];
  const userAnswer = document.getElementById('type-answer-input').value.trim();
  const isMatch = userAnswer.length > 0 && userAnswer === item.answer.trim();
  lastTypedAnswer = userAnswer;
  document.getElementById('a-block').style.display = 'block';
  document.getElementById('type-answer-row').style.display = 'none';
  document.getElementById('type-answer-input').blur(); // 結果確定待ちの間はEnter/Spaceを入力欄に食われないようにする

  const userAnswerLine = document.getElementById('user-answer-line');
  userAnswerLine.style.display = 'block';
  userAnswerLine.textContent = 'あなたの回答: ' + (userAnswer || '（未入力）');

  const badge = document.getElementById('auto-hint-badge');
  badge.style.display = 'block';
  badge.classList.toggle('match', isMatch);
  badge.classList.toggle('mismatch', !isMatch);

  if (isMatch) {
    // 完全一致した場合、正解した/不正解だったボタンを待たずに自動で正解として確定する
    badge.textContent = '✓ 一致';
    document.getElementById('judge-row').style.display = 'none';
    correct++;
    recordAnswerHistory(true);
    finishJudge();
  } else {
    // 不一致: 「不正解」を既定の結果として即座に確定し、例外的に正解へ上書きする
    // ための小さいボタンだけを表示する（次の問題ボタンのEnterでそのまま不正解確定へ進む）
    badge.textContent = '✗ 不一致（自動判定）';
    document.getElementById('judge-row').style.display = 'none';
    wrong++;
    wrongIndices.push(order[idx]);
    recordAnswerHistory(false);
    document.getElementById('override-correct-btn').style.display = 'inline-block';
    finishJudge();
  }
}

document.getElementById('submit-answer-btn').addEventListener('click', submitTypedAnswer);
document.getElementById('type-answer-input').addEventListener('keydown', (e) => {
  if (e.isComposing || e.keyCode === 229) {
    // IME変換中・変換確定のEnterはアプリの送信処理として扱わない
    return;
  }
  if (e.key === 'Enter') {
    if (awaitingJudgeConfirmation) {
      // 既に送信済みで結果確定待ちの場合、万一入力欄にフォーカスが残っていても
      // ここでは何もせず、documentのグローバルハンドラに確定処理を委ねる
      return;
    }
    e.preventDefault();
    e.stopPropagation(); // このEnterで送信した直後に、documentのキー操作ハンドラが同じ押下を
                          // 「確定待ち状態でのEnter」として二重に処理してしまうのを防ぐ
    submitTypedAnswer();
  }
});
document.getElementById('type-answer-input').addEventListener('focus', () => {
  // iOSはキーボード表示のアニメーションが完了してからでないと
  // scrollIntoViewの計算基準（ビューポート高さ）がずれるため少し待つ
  setTimeout(() => {
    document.getElementById('type-answer-input').scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 300);
});

document.getElementById('mark-correct').addEventListener('click', () => {
  correct++;
  recordAnswerHistory(true);
  finishJudge();
  document.getElementById('next-btn').click();
});
document.getElementById('mark-wrong').addEventListener('click', () => {
  wrong++;
  wrongIndices.push(order[idx]);
  recordAnswerHistory(false);
  finishJudge();
  document.getElementById('next-btn').click();
});
document.getElementById('override-correct-btn').addEventListener('click', () => {
  // 自動判定「不一致」で既に不正解として即時確定した分を、正解として上書きする
  wrong--;
  const pos = wrongIndices.lastIndexOf(order[idx]);
  if (pos !== -1) wrongIndices.splice(pos, 1);
  const lastHistory = answerHistory[answerHistory.length - 1];
  if (lastHistory) lastHistory.isCorrect = true;
  correct++;
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('wrong-count').textContent = wrong;
  document.getElementById('override-correct-btn').style.display = 'none';
  saveProgress();
  maybeSyncAfterAnswer();
  document.getElementById('next-btn').click();
});
function recordAnswerHistory(isCorrect) {
  const item = quiz[order[idx]];
  answerHistory.push({
    question: item.question,
    correctAnswer: item.answer,
    userAnswer: lastTypedAnswer,
    isCorrect
  });
}

function renderAnswerReview() {
  const section = document.getElementById('answer-review-section');
  const list = document.getElementById('answer-review-list');
  list.innerHTML = '';
  if (answerHistory.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  answerHistory.forEach((h, i) => {
    const item = document.createElement('div');
    item.className = 'review-item ' + (h.isCorrect ? 'correct' : 'wrong');

    const qDiv = document.createElement('div');
    qDiv.className = 'review-q';
    qDiv.textContent = (i + 1) + '. ' + h.question;
    item.appendChild(qDiv);

    const row = document.createElement('div');
    row.className = 'review-a-row';
    const label = document.createElement('span');
    label.className = 'review-label';
    label.textContent = h.isCorrect ? '✓ 正解' : '✗ 不正解';
    const answerSpan = document.createElement('span');
    answerSpan.className = 'review-answer';
    answerSpan.textContent = '正答: ' + h.correctAnswer;
    row.appendChild(label);
    row.appendChild(answerSpan);
    item.appendChild(row);

    if (h.userAnswer !== null && h.userAnswer !== undefined) {
      const userDiv = document.createElement('div');
      userDiv.className = 'review-user-answer';
      userDiv.textContent = 'あなたの入力: ' + (h.userAnswer || '（未入力）');
      item.appendChild(userDiv);
    }

    list.appendChild(item);
  });
}
function finishJudge() {
  awaitingJudgeConfirmation = false;
  document.getElementById('judge-row').style.display = 'none';
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('wrong-count').textContent = wrong;
  document.getElementById('next-btn').disabled = false;
  document.getElementById('next-btn-key-hint').style.display = 'inline-block';
  saveProgress();
  maybeSyncAfterAnswer();
}

document.getElementById('next-btn').addEventListener('click', () => {
  idx++;
  if (idx >= order.length) {
    document.getElementById('progress-bar').style.width = '100%';
    quizScreen.style.display = 'none';
    resultScreen.style.display = 'block';
    document.getElementById('final-score').textContent = correct + ' / ' + order.length;
    const rate = Math.round((correct / order.length) * 100);
    document.getElementById('final-msg').textContent = '正答率 ' + rate + '%（不正解 ' + wrong + '問）';
    const uniqueWrong = [...new Set(wrongIndices)];
    const reviewBtn = document.getElementById('review-btn');
    if (uniqueWrong.length > 0) {
      reviewBtn.style.display = 'inline-block';
      document.getElementById('review-count').textContent = uniqueWrong.length;
    } else {
      reviewBtn.style.display = 'none';
    }
    if (currentQuizId) {
      saveServerProgress(true);
    }
    renderAnswerReview();
    clearProgress();
  } else {
    renderQuestion();
    saveProgress();
  }
});

// クイズ画面をキーボードだけで進められるようにする。
// 状態（回答入力中／結果確定待ち／答え表示前／確定済みで次へ進める状態）ごとにキーの意味を切り替える。
document.addEventListener('keydown', (e) => {
  if (quizScreen.style.display !== 'block') return;
  if (e.isComposing || e.keyCode === 229) {
    // IME変換中・変換確定のEnter/Spaceはアプリのキー操作として扱わない
    return;
  }
  const key = e.key;
  const lowerKey = key.length === 1 ? key.toLowerCase() : key;
  const isRelevantKey = key === 'Enter' || key === ' ' || key === 'Spacebar' || lowerKey === 'f' || lowerKey === 'j';
  if (!isRelevantKey) return;

  // 自己採点モードで答えを表示した後の確定待ち状態。入力欄にフォーカスが残っているかどうかに
  // 関わらず必ずここで処理する（blur()やdisplay:noneのタイミングに依存すると、ブラウザによっては
  // 入力欄が実質フォーカスを保持したままになり、Enter/Spaceが入力欄に食われて反応しなくなるため）。
  if (awaitingJudgeConfirmation) {
    e.preventDefault();
    const markCorrect = key === 'Enter' || lowerKey === 'j';
    // mark-correct/mark-wrongのclickハンドラ内で次の問題への遷移まで行う
    document.getElementById(markCorrect ? 'mark-correct' : 'mark-wrong').click();
    return;
  }

  const typeAnswerRow = document.getElementById('type-answer-row');
  if (typeAnswerRow.style.display !== 'none') {
    // 文字入力モードでまだ回答を送信していない間は、入力欄自身のkeydown処理に任せる
    // （Enterでの送信は入力欄側のリスナーが担当。Space/F/Jは通常通り文字として入力させる）
    return;
  }

  // ここから先はSpaceキーによるページスクロールなど、ブラウザ標準の挙動を止める
  e.preventDefault();

  const revealRow = document.getElementById('reveal-row');
  const nextBtn = document.getElementById('next-btn');

  if (revealRow.style.display === 'flex' && key === 'Enter') {
    // 自己採点モードでまだ答えを表示していない: Enterで答えを表示する
    document.getElementById('reveal-btn').click();
    return;
  }

  if (!nextBtn.disabled) {
    // 完全一致による自動正解などで既に次へ進める状態になっている場合は、そのまま次の問題へ
    nextBtn.click();
  }
});

document.getElementById('review-btn').addEventListener('click', () => {
  order = [...new Set(wrongIndices)];
  idx = 0;
  correct = 0;
  wrong = 0;
  wrongIndices = [];
  answerHistory = [];
  mode = 'review';
  pendingSyncCount = 0;
  resultScreen.style.display = 'none';
  quizScreen.style.display = 'block';
  renderQuestion();
  saveProgress();
});

document.getElementById('question-list-btn').addEventListener('click', () => {
  const body = document.getElementById('question-list-body');
  body.innerHTML = '';
  document.getElementById('question-list-count').textContent = quiz.length;
  const currentQuestionIndex = order[idx];
  let currentRow = null;
  quiz.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'qlist-item';
    const isCurrent = i === currentQuestionIndex;
    if (isCurrent) row.classList.add('qlist-current');

    const qDiv = document.createElement('div');
    qDiv.className = 'qlist-q';
    qDiv.textContent = (i + 1) + '. ' + item.question;
    if (isCurrent) {
      const badge = document.createElement('span');
      badge.className = 'qlist-current-badge';
      badge.textContent = '今の問題';
      qDiv.appendChild(badge);
    }

    const aDiv = document.createElement('div');
    aDiv.className = 'qlist-a';
    aDiv.textContent = item.answer;

    const hintDiv = document.createElement('div');
    hintDiv.className = 'qlist-hint';
    hintDiv.textContent = 'タップして答えを表示/非表示';

    row.appendChild(qDiv);
    row.appendChild(aDiv);
    row.appendChild(hintDiv);
    row.addEventListener('click', () => aDiv.classList.toggle('revealed'));
    body.appendChild(row);
    if (isCurrent) currentRow = row;
  });
  document.getElementById('question-list-modal').style.display = 'flex';
  if (currentRow) {
    currentRow.scrollIntoView({ block: 'center' });
  }
});

document.getElementById('question-list-close').addEventListener('click', () => {
  document.getElementById('question-list-modal').style.display = 'none';
});

document.getElementById('back-to-setup').addEventListener('click', () => {
  clearProgress();
  quizScreen.style.display = 'none';
  setupScreen.style.display = 'block';
  loadQuizSetList();
});
document.getElementById('edit-again-btn').addEventListener('click', () => {
  resultScreen.style.display = 'none';
  setupScreen.style.display = 'block';
  loadQuizSetList();
});
document.getElementById('restart-btn').addEventListener('click', () => {
  idx = 0; correct = 0; wrong = 0;
  wrongIndices = [];
  answerHistory = [];
  mode = 'normal';
  pendingSyncCount = 0;
  order = quiz.map((_, i) => i);
  if (shuffleOn) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }
  resultScreen.style.display = 'none';
  quizScreen.style.display = 'block';
  renderQuestion();
  saveProgress();
});
</script>
